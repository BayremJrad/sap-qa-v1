$kind: http-request
url: "{{baseUrl}}/vehicle/:id"
method: GET
pathVariables:
  id: "{{vehicleID}}"
auth:
  type: jwt
  credentials:
    isSecretBase64Encoded: true
    secret: "{{jwtSecret}}"
    algorithm: HS256
    payload: "{}"
    addTokenTo: header
    headerPrefix: Bearer
    queryParamKey: token
    header: "{}"
scripts:
  - type: afterResponse
    code: |-
      const vinDecode = pm.require('npm:vin-decode@0.2.0');
      const qaWorkshopPackage = pm.require('@postvehicle-enterprise-team-d29a54ad-ac82-48fc-9af7-d4774bd6/qa_workshop_package');
      pm.test("VIN is a validly-formatted string", function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData.vehicle.vin).to.be.a.string;
          pm.expect(qaWorkshopPackage.isValidVIN(jsonData.vehicle.vin)).to.be.true;
          console.log("Decoding VIN ...")
          console.log(vinDecode(jsonData.vehicle.vin).decode());
      });
    language: text/javascript
    packages:
      npm:vin-decode@0.2.0:
        id: npm:vin-decode@0.2.0
      "@postvehicle-enterprise-team-d29a54ad-ac82-48fc-9af7-d4774bd6/qa_workshop_package":
        id: 01a1a5d4-e74c-7690-b125-a4d9f03067cf
order: 2000
